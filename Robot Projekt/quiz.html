<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page quizPage">
        <h1 class="quizTitle">QUIZ 1</h1>
        <div class="quizRobotWrapper">
            <p id="speechBubble" class="speechBubble">Prøv igen, hvad betyder det at være grøn?</p>
            <img id="quizRobot" src="images/robot-neutrual.svg" alt="Universe robot" class="robotImg">
        </div>
        
        <p class="quizQuestion">Universe har fået et flot bevis for at være en 'Green Attraction'. Hvad betyder det?</p>
        
        <div class="quizGrid">
            <button class="svarCard" onclick="checkAnswer(this, false)">
                <img src="images/svar-1.svg" alt="" class="svarImg">
                <p>At alt i hele Universe skal males grøn</p>
            </button>
            <button class="svarCard" onclick="checkAnswer(this, false)">
                <img src="images/svar-2.svg" alt="" class="svarImg">
                <p>At alle forlystelser kun kører på grønsager</p>
            </button>
            <button class="svarCard" onclick="checkAnswer(this, true)">
                <img src="images/svar-3.svg" alt="" class="svarImg">
                <p>At Universe passer godt på miljøet og naturen</p>
            </button>
            <button class="svarCard" onclick="checkAnswer(this, false)">
                <img src="images/svar-4.svg" alt="" class="svarImg">
                <p>At den Blå Kube nu skal være den Grønne Kube</p>
            </button>
        </div>
    </main>

    <nav class="navbar">
        <ul class="navList">
            <li class="navItem"><img src="images/icon-wallet.svg" alt=""><span>Wallet</span></li>
            <li class="navItem"><img src="images/icon-mad.svg" alt=""><span>Mad</span></li>
            <li class="navItem"><img src="images/icon-hjem.svg" alt=""><span>Hjem</span></a></li>
            <li class="navItem"><img src="images/icon-spil.svg" alt=""><span>Spil</span></li>
            <li class="navItem"><img src="images/icon-profil.svg" alt=""><span>Profil</span></li>
        </ul>
    </nav>

    <script src="app.js"></script>
</body>
</html>
